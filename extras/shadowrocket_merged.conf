# 说明：https 的重写需要开启 HTTPS 解密并安装你自己的 CA 证书后才会生效。
'^https?://(www.)?g.cn' 'https://www.google.com' 302
'^https?://(www.)?google.cn' 'https://www.google.com' 302

[MITM]
# 出于安全考虑，已删除原配置内置的公共 CA 证书/私钥（ca-p12 / ca-passphrase）。
# 官方懒人配置的写法是只声明解密范围（hostname），是否真正解密由 Shadowrocket 的
# 「HTTPS 解密」开关 + 已安装的证书决定。如需 HTTPS 解密（URL Rewrite 的 https 规则依赖它）：
# Shadowrocket → 配置 → 点配置的 ⓘ → HTTPS 解密 → 证书 → 生成新的 CA 证书 → 安装。
hostname = *.google.cn, google.cn, g.cn
